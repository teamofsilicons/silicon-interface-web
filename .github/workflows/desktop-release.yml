name: Desktop release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing desktop-vX.Y.Z tag to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  RELEASE_REF: ${{ inputs.release_tag || github.ref }}

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node desktop/scripts/verify-release-version.mjs "$RELEASE_TAG"
      - run: pnpm test:deploy
      - run: pnpm security:audit
      - run: pnpm desktop:test
      - run: pnpm exec tsc --noEmit
      - run: pnpm test:reliability
      - run: pnpm build
      - run: pnpm -C desktop sbom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-sbom
          path: desktop/dist/desktop.sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

  package-macos:
    needs: verify
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    env:
      CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node desktop/scripts/check-release-env.mjs mac
      - run: pnpm -C desktop build
      - name: Build, sign, and notarize
        run: pnpm -C desktop exec electron-builder --mac --${{ matrix.arch }} --publish never --config.directories.output=dist-${{ matrix.arch }}
      - name: Verify update artifacts
        run: node desktop/scripts/verify-update-artifacts.mjs desktop/dist-${{ matrix.arch }} darwin ${{ matrix.arch }}
      - name: Verify application signature
        run: |
          app_path="$(find desktop/dist-${{ matrix.arch }} -type d -name 'Silicon Interface.app' -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          xcrun stapler validate -v "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"
      - name: Verify notarized app inside DMG and ZIP
        run: |
          dmg_path="$(find desktop/dist-${{ matrix.arch }} -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          zip_path="$(find desktop/dist-${{ matrix.arch }} -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$dmg_path"
          test -n "$zip_path"
          hdiutil verify "$dmg_path"

          mount_dir="$(mktemp -d)"
          zip_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
            rm -rf "$mount_dir" "$zip_dir"
          }
          trap cleanup EXIT

          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg_path"
          dmg_app="$(find "$mount_dir" -maxdepth 2 -type d -name 'Silicon Interface.app' -print -quit)"
          test -n "$dmg_app"
          codesign --verify --deep --strict --verbose=2 "$dmg_app"
          xcrun stapler validate -v "$dmg_app"
          spctl --assess --type execute --verbose=2 "$dmg_app"
          hdiutil detach "$mount_dir"

          ditto -x -k "$zip_path" "$zip_dir"
          zip_app="$(find "$zip_dir" -maxdepth 2 -type d -name 'Silicon Interface.app' -print -quit)"
          test -n "$zip_app"
          codesign --verify --deep --strict --verbose=2 "$zip_app"
          xcrun stapler validate -v "$zip_app"
          spctl --assess --type execute --verbose=2 "$zip_app"
      - name: Launch signed macOS ZIP application
        if: ${{ (matrix.arch == 'x64' && runner.arch == 'X64') || (matrix.arch == 'arm64' && runner.arch == 'ARM64') }}
        run: |
          zip_path="$(find desktop/dist-${{ matrix.arch }} -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$zip_path"
          run_dir="$(mktemp -d)"
          trap 'rm -rf "$run_dir"' EXIT
          ditto -x -k "$zip_path" "$run_dir"
          zip_app="$(find "$run_dir" -maxdepth 2 -type d -name 'Silicon Interface.app' -print -quit)"
          test -n "$zip_app"
          node desktop/scripts/smoke-mac-engineering.mjs "$zip_app" --signature-mode release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-mac-${{ matrix.arch }}
          path: |
            desktop/dist-${{ matrix.arch }}/*.dmg
            desktop/dist-${{ matrix.arch }}/*.zip
            desktop/dist-${{ matrix.arch }}/*.yml
            desktop/dist-${{ matrix.arch }}/*.blockmap
            !desktop/dist-${{ matrix.arch }}/builder-debug.yml
          if-no-files-found: error
          retention-days: 14

  package-windows:
    needs: verify
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    env:
      WINDOWS_SIGNING_PROVIDER: ${{ vars.WINDOWS_SIGNING_PROVIDER }}
      WINDOWS_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
      WIN_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      SSL_ESIGNER_USERNAME: ${{ secrets.SSL_ESIGNER_USERNAME }}
      SSL_ESIGNER_PASSWORD: ${{ secrets.SSL_ESIGNER_PASSWORD }}
      SSL_ESIGNER_CREDENTIAL_ID: ${{ secrets.SSL_ESIGNER_CREDENTIAL_ID }}
      SSL_ESIGNER_TOTP_SECRET: ${{ secrets.SSL_ESIGNER_TOTP_SECRET }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        if: ${{ env.WINDOWS_SIGNING_PROVIDER == 'sslcom-esigner' }}
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - name: Verify and install SSL.com CodeSignTool
        if: ${{ env.WINDOWS_SIGNING_PROVIDER == 'sslcom-esigner' }}
        shell: pwsh
        run: desktop/scripts/setup-esigner.ps1
      - run: node desktop/scripts/check-release-env.mjs win
      - run: pnpm -C desktop build
      - name: Build and sign
        shell: pwsh
        run: |
          $arguments = @(
            "--win",
            "--${{ matrix.arch }}",
            "--publish", "never",
            "--config.directories.output=dist-${{ matrix.arch }}"
          )
          if ($env:WINDOWS_SIGNING_PROVIDER -eq "sslcom-esigner") {
            $arguments += "--config.win.signtoolOptions.sign=scripts/esigner-sign.cjs"
            $arguments += "--config.win.signtoolOptions.publisherName=$env:WINDOWS_PUBLISHER_NAME"
          }
          pnpm -C desktop exec electron-builder @arguments
      - name: Verify update artifacts
        run: node desktop/scripts/verify-update-artifacts.mjs desktop/dist-${{ matrix.arch }} win32 ${{ matrix.arch }}
      - name: Verify Windows distributable signatures
        shell: pwsh
        run: |
          $installers = Get-ChildItem "desktop/dist-${{ matrix.arch }}" -Filter *.exe
          if ($installers.Count -ne 1) { throw "Expected exactly one Windows installer, found $($installers.Count)" }
          $applications = Get-ChildItem "desktop/dist-${{ matrix.arch }}" -Recurse -File -Filter "Silicon Interface.exe" |
            Where-Object { $_.Directory.Name -match '^win(?:-[a-z0-9]+)?-unpacked$' }
          if ($applications.Count -ne 1) { throw "Expected exactly one unpacked application, found $($applications.Count)" }
          $signerSubject = $null
          foreach ($candidate in @($installers) + @($applications)) {
            $signature = Get-AuthenticodeSignature $candidate.FullName
            if ($signature.Status -ne "Valid") {
              throw "Invalid signature on $($candidate.FullName): $($signature.Status)"
            }
            if ($null -eq $signature.SignerCertificate) {
              throw "Signature on $($candidate.FullName) has no signer certificate"
            }
            if ($null -eq $signature.TimeStamperCertificate) {
              throw "Signature on $($candidate.FullName) has no trusted timestamp"
            }
            if ($env:WINDOWS_SIGNING_PROVIDER -eq "sslcom-esigner") {
              $actualPublisher = $signature.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
              if ($actualPublisher -cne $env:WINDOWS_PUBLISHER_NAME) {
                throw "Publisher '$actualPublisher' does not exactly match '$env:WINDOWS_PUBLISHER_NAME'"
              }
            }
            if ($null -eq $signerSubject) {
              $signerSubject = $signature.SignerCertificate.Subject
            } elseif ($signature.SignerCertificate.Subject -ne $signerSubject) {
              throw "Windows artifacts were signed by different publishers"
            }
          }
      - name: Launch signed Windows application
        if: ${{ (matrix.arch == 'x64' && runner.arch == 'X64') || (matrix.arch == 'arm64' && runner.arch == 'ARM64') }}
        run: node desktop/scripts/smoke-windows-package.mjs desktop/dist-${{ matrix.arch }} --require-signature
      - name: Install and uninstall signed Windows package
        if: ${{ (matrix.arch == 'x64' && runner.arch == 'X64') || (matrix.arch == 'arm64' && runner.arch == 'ARM64') }}
        run: node desktop/scripts/smoke-windows-installer.mjs desktop/dist-${{ matrix.arch }} --require-signature
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-win-${{ matrix.arch }}
          path: |
            desktop/dist-${{ matrix.arch }}/*.exe
            desktop/dist-${{ matrix.arch }}/*.zip
            desktop/dist-${{ matrix.arch }}/*.yml
            desktop/dist-${{ matrix.arch }}/*.blockmap
            !desktop/dist-${{ matrix.arch }}/builder-debug.yml
          if-no-files-found: error
          retention-days: 14

  package-linux:
    needs: verify
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C desktop build
      - name: Build AppImage and Debian package
        run: pnpm -C desktop exec electron-builder --linux --${{ matrix.arch }} --publish never --config.directories.output=dist-${{ matrix.arch }}
      - name: Verify update artifacts
        run: node desktop/scripts/verify-update-artifacts.mjs desktop/dist-${{ matrix.arch }} linux ${{ matrix.arch }}
      - name: Install Linux runtime-smoke dependencies
        if: ${{ (matrix.arch == 'x64' && runner.arch == 'X64') || (matrix.arch == 'arm64' && runner.arch == 'ARM64') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb dbus-x11
      - name: Launch packaged Linux AppImage
        if: ${{ (matrix.arch == 'x64' && runner.arch == 'X64') || (matrix.arch == 'arm64' && runner.arch == 'ARM64') }}
        run: node desktop/scripts/smoke-linux-package.mjs desktop/dist-${{ matrix.arch }} --format appimage
      - name: Install and launch packaged Linux DEB
        if: ${{ (matrix.arch == 'x64' && runner.arch == 'X64') || (matrix.arch == 'arm64' && runner.arch == 'ARM64') }}
        run: node desktop/scripts/smoke-linux-package.mjs desktop/dist-${{ matrix.arch }} --format deb --deb-mode install
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-linux-${{ matrix.arch }}
          path: |
            desktop/dist-${{ matrix.arch }}/*.AppImage
            desktop/dist-${{ matrix.arch }}/*.deb
            desktop/dist-${{ matrix.arch }}/*.yml
            !desktop/dist-${{ matrix.arch }}/builder-debug.yml
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [package-macos, package-windows, package-linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      AWS_RELEASE_ROLE_ARN: ${{ vars.AWS_RELEASE_ROLE_ARN }}
      AWS_RELEASE_BUCKET: ${{ vars.AWS_RELEASE_BUCKET }}
      AWS_RELEASE_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.AWS_RELEASE_CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          path: release-staging
      - name: Arrange independent updater feeds
        run: |
          mkdir -p release/darwin/x64 release/darwin/arm64
          mkdir -p release/win32/x64 release/win32/arm64
          mkdir -p release/linux/x64 release/linux/arm64
          mv release-staging/desktop-mac-x64/* release/darwin/x64/
          mv release-staging/desktop-mac-arm64/* release/darwin/arm64/
          mv release-staging/desktop-win-x64/* release/win32/x64/
          mv release-staging/desktop-win-arm64/* release/win32/arm64/
          mv release-staging/desktop-linux-x64/* release/linux/x64/
          mv release-staging/desktop-linux-arm64/* release/linux/arm64/
          mv release-staging/desktop-sbom/* release/
      - run: node desktop/scripts/release-manifest.mjs release
      - name: Require the release publishing role
        run: |
          test -n "$AWS_RELEASE_ROLE_ARN"
          test -n "$AWS_RELEASE_BUCKET"
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ env.AWS_RELEASE_ROLE_ARN }}
          aws-region: us-east-1
      - run: aws sts get-caller-identity
      - name: Attest release provenance
        if: ${{ vars.ENABLE_GITHUB_ATTESTATIONS == 'true' }}
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: release/**/*
      - name: Prepare verified GitHub draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node desktop/scripts/publish-github-release.mjs prepare release "$RELEASE_TAG"
      - name: Publish payloads, then atomically activate updater pointers
        run: node desktop/scripts/publish-release.mjs release
      - name: Publish verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node desktop/scripts/publish-github-release.mjs finalize release "$RELEASE_TAG"
