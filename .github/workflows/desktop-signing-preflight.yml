name: Desktop signing preflight

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Signing path to verify without publishing
        required: true
        default: macos
        type: choice
        options:
          - macos
          - windows

permissions:
  contents: read

concurrency:
  group: desktop-signing-preflight
  cancel-in-progress: false

jobs:
  macos:
    name: macOS sign, notarize, and verify
    if: ${{ inputs.platform == 'macos' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
          - os: macos-14
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node desktop/scripts/check-release-env.mjs mac
      - run: pnpm -C desktop build
      - name: Build, sign, and notarize
        run: pnpm -C desktop exec electron-builder --mac --${{ matrix.arch }} --publish never --config.directories.output=dist-signing-preflight
      - name: Verify update artifacts
        run: node desktop/scripts/verify-update-artifacts.mjs desktop/dist-signing-preflight darwin ${{ matrix.arch }}
      - name: Verify packaged application and containers
        run: |
          output_dir="desktop/dist-signing-preflight"
          app_path="$(find "$output_dir" -type d -name 'Silicon Interface.app' -print -quit)"
          dmg_path="$(find "$output_dir" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          zip_path="$(find "$output_dir" -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$app_path"
          test -n "$dmg_path"
          test -n "$zip_path"

          codesign --verify --deep --strict --verbose=2 "$app_path"
          xcrun stapler validate -v "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"
          hdiutil verify "$dmg_path"

          mount_dir="$(mktemp -d)"
          zip_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
            rm -rf "$mount_dir" "$zip_dir"
          }
          trap cleanup EXIT

          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg_path"
          dmg_app="$(find "$mount_dir" -maxdepth 2 -type d -name 'Silicon Interface.app' -print -quit)"
          test -n "$dmg_app"
          codesign --verify --deep --strict --verbose=2 "$dmg_app"
          xcrun stapler validate -v "$dmg_app"
          spctl --assess --type execute --verbose=2 "$dmg_app"
          hdiutil detach "$mount_dir"

          ditto -x -k "$zip_path" "$zip_dir"
          zip_app="$(find "$zip_dir" -maxdepth 2 -type d -name 'Silicon Interface.app' -print -quit)"
          test -n "$zip_app"
          codesign --verify --deep --strict --verbose=2 "$zip_app"
          xcrun stapler validate -v "$zip_app"
          spctl --assess --type execute --verbose=2 "$zip_app"
      - name: Launch signed application
        run: |
          zip_path="$(find desktop/dist-signing-preflight -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$zip_path"
          run_dir="$(mktemp -d)"
          trap 'rm -rf "$run_dir"' EXIT
          ditto -x -k "$zip_path" "$run_dir"
          zip_app="$(find "$run_dir" -maxdepth 2 -type d -name 'Silicon Interface.app' -print -quit)"
          test -n "$zip_app"
          node desktop/scripts/smoke-mac-engineering.mjs "$zip_app" --signature-mode release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: desktop-macos-signing-preflight-${{ matrix.arch }}
          path: |
            desktop/dist-signing-preflight/*.dmg
            desktop/dist-signing-preflight/*.zip
            desktop/dist-signing-preflight/*.yml
            desktop/dist-signing-preflight/*.blockmap
          if-no-files-found: warn
          retention-days: 3

  windows:
    name: Windows sign, install, launch, and verify
    if: ${{ inputs.platform == 'windows' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      WINDOWS_SIGNING_PROVIDER: ${{ vars.WINDOWS_SIGNING_PROVIDER }}
      WINDOWS_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
      WIN_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      SSL_ESIGNER_USERNAME: ${{ secrets.SSL_ESIGNER_USERNAME }}
      SSL_ESIGNER_PASSWORD: ${{ secrets.SSL_ESIGNER_PASSWORD }}
      SSL_ESIGNER_CREDENTIAL_ID: ${{ secrets.SSL_ESIGNER_CREDENTIAL_ID }}
      SSL_ESIGNER_TOTP_SECRET: ${{ secrets.SSL_ESIGNER_TOTP_SECRET }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        if: ${{ env.WINDOWS_SIGNING_PROVIDER == 'sslcom-esigner' }}
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - name: Verify and install SSL.com CodeSignTool
        if: ${{ env.WINDOWS_SIGNING_PROVIDER == 'sslcom-esigner' }}
        shell: pwsh
        run: desktop/scripts/setup-esigner.ps1
      - run: node desktop/scripts/check-release-env.mjs win
      - run: pnpm -C desktop build
      - name: Build and sign native candidate
        shell: pwsh
        run: |
          $arguments = @(
            "--win", "--${{ matrix.arch }}",
            "--publish", "never",
            "--config.directories.output=dist-signing-preflight"
          )
          if ($env:WINDOWS_SIGNING_PROVIDER -eq "sslcom-esigner") {
            $arguments += "--config.win.signtoolOptions.sign=scripts/esigner-sign.cjs"
            $arguments += "--config.win.signtoolOptions.publisherName=$env:WINDOWS_PUBLISHER_NAME"
          }
          pnpm -C desktop exec electron-builder @arguments
      - name: Verify update artifacts
        run: node desktop/scripts/verify-update-artifacts.mjs desktop/dist-signing-preflight win32 ${{ matrix.arch }}
      - name: Launch signed packaged application
        run: node desktop/scripts/smoke-windows-package.mjs desktop/dist-signing-preflight --require-signature
      - name: Install, launch, and uninstall signed package
        run: node desktop/scripts/smoke-windows-installer.mjs desktop/dist-signing-preflight --require-signature
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: desktop-windows-signing-preflight-${{ matrix.arch }}
          path: |
            desktop/dist-signing-preflight/*.exe
            desktop/dist-signing-preflight/*.zip
            desktop/dist-signing-preflight/*.yml
            desktop/dist-signing-preflight/*.blockmap
          if-no-files-found: warn
          retention-days: 3
