name: Desktop

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "desktop/build/**"
      - "desktop/resources/**"
      - "desktop/scripts/**"
      - "desktop/src/**"
      - "desktop/tests/**"
      - "desktop/electron-builder.yml"
      - "desktop/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/dependency-audit.mjs"
      - "tests/deploy/dependency-audit.test.mjs"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/desktop-release.yml"
      - ".github/workflows/desktop-signing-preflight.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "desktop/build/**"
      - "desktop/resources/**"
      - "desktop/scripts/**"
      - "desktop/src/**"
      - "desktop/tests/**"
      - "desktop/electron-builder.yml"
      - "desktop/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/dependency-audit.mjs"
      - "tests/deploy/dependency-audit.test.mjs"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/desktop-release.yml"
      - ".github/workflows/desktop-signing-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:deploy
      - run: pnpm security:audit
      - run: pnpm desktop:test
      - run: pnpm exec tsc --noEmit
      - run: pnpm test:reliability
      - run: pnpm build

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: mac
            platform: darwin
            arch: x64
          - os: macos-14
            target: mac
            platform: darwin
            arch: arm64
          - os: windows-2022
            target: win
            platform: win32
            arch: x64
          - os: windows-11-arm
            target: win
            platform: win32
            arch: arm64
          - os: ubuntu-22.04
            target: linux
            platform: linux
            arch: x64
          - os: ubuntu-22.04-arm
            target: linux
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create isolated Windows engineering signing identity
        if: ${{ matrix.target == 'win' }}
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $publisher = 'Silicon Interface Engineering CI'
          $passwordBytes = New-Object byte[] 32
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($passwordBytes)
          $passwordText = [Convert]::ToBase64String($passwordBytes)
          Write-Output "::add-mask::$passwordText"
          $pfxPath = Join-Path $env:RUNNER_TEMP 'silicon-engineering-signing.pfx'
          $cerPath = Join-Path $env:RUNNER_TEMP 'silicon-engineering-signing.cer'
          $rsa = [System.Security.Cryptography.RSA]::Create(2048)
          $request = [System.Security.Cryptography.X509Certificates.CertificateRequest]::new(
            "CN=$publisher",
            $rsa,
            [System.Security.Cryptography.HashAlgorithmName]::SHA256,
            [System.Security.Cryptography.RSASignaturePadding]::Pkcs1
          )
          $request.CertificateExtensions.Add(
            [System.Security.Cryptography.X509Certificates.X509KeyUsageExtension]::new(
              [System.Security.Cryptography.X509Certificates.X509KeyUsageFlags]::DigitalSignature,
              $true
            )
          )
          $enhancedUsages = [System.Security.Cryptography.OidCollection]::new()
          [void]$enhancedUsages.Add(
            [System.Security.Cryptography.Oid]::new('1.3.6.1.5.5.7.3.3', 'Code Signing')
          )
          $request.CertificateExtensions.Add(
            [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]::new(
              $enhancedUsages,
              $true
            )
          )
          $request.CertificateExtensions.Add(
            [System.Security.Cryptography.X509Certificates.X509SubjectKeyIdentifierExtension]::new(
              $request.PublicKey,
              $false
            )
          )
          $certificate = $request.CreateSelfSigned(
            [DateTimeOffset]::UtcNow.AddMinutes(-5),
            [DateTimeOffset]::UtcNow.AddDays(2)
          )
          [IO.File]::WriteAllBytes(
            $pfxPath,
            $certificate.Export(
              [System.Security.Cryptography.X509Certificates.X509ContentType]::Pfx,
              $passwordText
            )
          )
          [IO.File]::WriteAllBytes(
            $cerPath,
            $certificate.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert)
          )
          $publicCertificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($cerPath)
          foreach ($storeName in @('Root', 'TrustedPublisher')) {
            $store = [System.Security.Cryptography.X509Certificates.X509Store]::new(
              $storeName,
              [System.Security.Cryptography.X509Certificates.StoreLocation]::LocalMachine
            )
            try {
              $store.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
              $store.Add($publicCertificate)
            } finally {
              $store.Close()
            }
          }
          "WIN_CSC_LINK=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WIN_CSC_KEY_PASSWORD=$passwordText" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_PUBLISHER_NAME=$publisher" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SILICON_ENGINEERING_CERT_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Package
        id: package
        run: |
          pnpm -C desktop build
          pnpm -C desktop exec electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.target == 'win' && 'true' || 'false' }}
      - name: Verify update artifacts
        run: node desktop/scripts/verify-update-artifacts.mjs desktop/dist ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Prove engineering Windows identity fails the production publisher gate
        if: ${{ matrix.target == 'win' }}
        shell: pwsh
        run: |
          $engineeringPublisher = $env:WINDOWS_PUBLISHER_NAME
          $env:WINDOWS_PUBLISHER_NAME = 'CA Verified Production Publisher'
          $ErrorActionPreference = 'Continue'
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          $output = & node desktop/scripts/smoke-windows-package.mjs desktop/dist --require-signature 2>&1
          $signatureExitCode = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($signatureExitCode -eq 0) {
            throw "Engineering identity unexpectedly passed the production publisher gate"
          }
          $outputText = $output | Out-String
          $outputText | Write-Host
          if ($outputText -notmatch 'does not exactly match') {
            throw "Signature gate failed for an unexpected reason"
          }
          $env:WINDOWS_PUBLISHER_NAME = $engineeringPublisher
          Write-Host "windows-signature-smoke: engineering publisher correctly rejected for production"
          $global:LASTEXITCODE = 0
      - name: Install Linux runtime-smoke dependencies
        if: ${{ matrix.target == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb dbus-x11
      - name: Launch packaged macOS application
        if: ${{ matrix.target == 'mac' }}
        run: node desktop/scripts/smoke-mac-engineering.mjs desktop/dist
      - name: Launch packaged Windows application
        if: ${{ matrix.target == 'win' }}
        run: node desktop/scripts/smoke-windows-package.mjs desktop/dist --require-signature
      - name: Install and uninstall Windows package
        if: ${{ matrix.target == 'win' }}
        run: node desktop/scripts/smoke-windows-installer.mjs desktop/dist --require-signature
      - name: Launch packaged Linux AppImage
        if: ${{ matrix.target == 'linux' }}
        run: node desktop/scripts/smoke-linux-package.mjs desktop/dist --format appimage
      - name: Install and launch packaged Linux DEB
        if: ${{ matrix.target == 'linux' }}
        run: node desktop/scripts/smoke-linux-package.mjs desktop/dist --format deb --deb-mode install
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && steps.package.outcome == 'success' }}
        with:
          name: silicon-interface-${{ matrix.target }}-${{ matrix.arch }}
          path: desktop/dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Remove Windows engineering signing identity
        if: ${{ always() && matrix.target == 'win' }}
        shell: pwsh
        run: |
          if ($env:SILICON_ENGINEERING_CERT_THUMBPRINT) {
            foreach ($storeName in @('Root', 'TrustedPublisher')) {
              $store = [System.Security.Cryptography.X509Certificates.X509Store]::new(
                $storeName,
                [System.Security.Cryptography.X509Certificates.StoreLocation]::LocalMachine
              )
              try {
                $store.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
                $matches = $store.Certificates.Find(
                  [System.Security.Cryptography.X509Certificates.X509FindType]::FindByThumbprint,
                  $env:SILICON_ENGINEERING_CERT_THUMBPRINT,
                  $false
                )
                foreach ($certificate in $matches) { $store.Remove($certificate) }
              } finally {
                $store.Close()
              }
            }
          }
          Remove-Item (Join-Path $env:RUNNER_TEMP 'silicon-engineering-signing.pfx') -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:RUNNER_TEMP 'silicon-engineering-signing.cer') -Force -ErrorAction SilentlyContinue
