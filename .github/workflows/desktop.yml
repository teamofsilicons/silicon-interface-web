name: Desktop

on:
  pull_request:
    paths:
      - "desktop/build/**"
      - "desktop/resources/**"
      - "desktop/scripts/**"
      - "desktop/src/**"
      - "desktop/tests/**"
      - "desktop/electron-builder.yml"
      - "desktop/package.json"
      - "src/components/desktop-bridge-init.tsx"
      - "src/components/chat/media-previewer.tsx"
      - "src/lib/drafts.ts"
      - "src/lib/desktop-bridge.ts"
      - "src/lib/notifications.ts"
      - "src/lib/push.ts"
      - "public/sw.js"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    tags: ["desktop-v*"]
    paths:
      - "desktop/build/**"
      - "desktop/resources/**"
      - "desktop/scripts/**"
      - "desktop/src/**"
      - "desktop/tests/**"
      - "desktop/electron-builder.yml"
      - "desktop/package.json"
      - "src/components/desktop-bridge-init.tsx"
      - "src/components/chat/media-previewer.tsx"
      - "src/lib/drafts.ts"
      - "src/lib/desktop-bridge.ts"
      - "src/lib/notifications.ts"
      - "src/lib/push.ts"
      - "public/sw.js"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:test
      - run: pnpm exec tsc --noEmit
      - run: pnpm test:reliability
      - run: pnpm build

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac
            platform: darwin
            arch: arm64
          - os: windows-2022
            target: win
            platform: win32
            arch: x64
          - os: ubuntu-22.04
            target: linux
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package
        run: pnpm desktop:dist:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify update artifacts
        run: node desktop/scripts/verify-update-artifacts.mjs desktop/dist ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Prove unsigned Windows candidates fail the release signature gate
        if: ${{ matrix.target == 'win' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          $output = & node desktop/scripts/smoke-windows-package.mjs desktop/dist --require-signature 2>&1
          $signatureExitCode = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($signatureExitCode -eq 0) {
            throw "Unsigned engineering application unexpectedly passed the Authenticode gate"
          }
          $outputText = $output | Out-String
          $outputText | Write-Host
          if ($outputText -notmatch 'Authenticode verification failed') {
            throw "Signature gate failed for an unexpected reason"
          }
          Write-Host "windows-signature-smoke: unsigned candidate correctly rejected"
          $global:LASTEXITCODE = 0
      - name: Install Linux runtime-smoke dependencies
        if: ${{ matrix.target == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb dbus-x11
      - name: Launch packaged macOS application
        if: ${{ matrix.target == 'mac' }}
        run: node desktop/scripts/smoke-mac-engineering.mjs desktop/dist
      - name: Launch packaged Windows application
        if: ${{ matrix.target == 'win' }}
        run: node desktop/scripts/smoke-windows-package.mjs desktop/dist
      - name: Install and uninstall Windows package
        if: ${{ matrix.target == 'win' }}
        run: node desktop/scripts/smoke-windows-installer.mjs desktop/dist
      - name: Launch packaged Linux AppImage
        if: ${{ matrix.target == 'linux' }}
        run: node desktop/scripts/smoke-linux-package.mjs desktop/dist --format appimage
      - name: Install and launch packaged Linux DEB
        if: ${{ matrix.target == 'linux' }}
        run: node desktop/scripts/smoke-linux-package.mjs desktop/dist --format deb --deb-mode install
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: silicon-interface-${{ matrix.target }}
          path: desktop/dist/*
          if-no-files-found: error
          retention-days: 14
