# electron-builder config for the Silicon Interface desktop app.
# The signed shell loads the exact production HTTPS Interface origin. Only the
# compiled, sandboxed Electron shell and its static recovery assets ship here;
# there is no localhost server or bundled request proxy.
appId: ai.45d.silicon-interface
productName: Silicon Interface
copyright: Copyright © 2026 Team of Silicons
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: dist
  buildResources: build

# Keep the package allow-list narrow. electron-updater and its required runtime
# dependencies are collected from package.json automatically.
files:
  - compiled/**/*
  - resources/**/*
  - build/icon.png
  - package.json

npmRebuild: false
asar: true
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false

publish:
  - provider: generic
    url: https://downloads.teamofsilicons.com/interface/stable

protocols:
  - name: Silicon Interface
    schemes:
      - silicon

win:
  icon: build/icon.png
  requestedExecutionLevel: asInvoker
  signtoolOptions:
    # One current SHA-256 signature avoids obsolete SHA-1 and unnecessary
    # cloud-HSM operations. The release job independently verifies Authenticode.
    signingHashAlgorithms:
      - sha256
  target:
    - nsis
    - zip
nsis:
  # Keep the per-user install registry identity stable across app renames and
  # electron-builder upgrades. The Windows installer smoke test also uses this
  # exact contract to discover the directory selected by Windows.
  guid: 4010082e-265c-5251-a3ae-34a383fe3e0e
  oneClick: true
  deleteAppDataOnUninstall: false

linux:
  icon: build/icon.png
  category: Network
  executableName: silicon-interface
  syncDesktopName: true
  maintainer: team@45d.ai
  synopsis: Desktop client for Silicon Interface
  target:
    - AppImage
    - deb

mac:
  category: public.app-category.social-networking
  minimumSystemVersion: "12.0"
  # Fail closed instead of allowing another Apple identity in the imported
  # archive/keychain (for example Apple Distribution) to sign a direct-download
  # build that notarization will reject.
  identity: "Shubham Gupta (LTBSK59BJ2)"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Silicon Interface uses the microphone only when you record a voice message or join a call.
    NSCameraUsageDescription: Silicon Interface uses the camera only when you choose to share video.
  target:
    - dmg
    - zip
