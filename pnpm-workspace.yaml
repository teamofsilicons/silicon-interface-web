packages:
  - packages/*
  - desktop

allowBuilds:
  core-js: true
  electron-winstaller: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# electron's postinstall downloads the platform binary — required for the
# desktop build (pnpm 10 blocks build scripts unless approved here).
onlyBuiltDependencies:
  - electron
